<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — signal lost · Ultimate Windows Optimizer</title>
<meta name="description" content="Page not found on the Ultimate Windows Optimizer site.">
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
:root{--bg:#050705;--panel:#0a110c;--line:#16251b;--line-2:#1e3527;--fg:#d6f5dc;--fg-dim:#8fb39a;--green:#22c55e;--green-br:#4ade80;--mono:ui-monospace,"Cascadia Mono","JetBrains Mono",Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:var(--mono);padding:24px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.28) 3px,rgba(0,0,0,0) 4px);opacity:.55}
.term{width:100%;max-width:640px;background:linear-gradient(180deg,#070c08,#040704);border:1px solid var(--line-2);border-radius:12px;overflow:hidden;box-shadow:0 24px 70px -30px rgba(34,197,94,.5)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 13px;background:linear-gradient(180deg,#0d150f,#0a110c);border-bottom:1px solid var(--line)}
.tl{width:11px;height:11px;border-radius:50%}.r{background:#ff5f56}.y{background:#ffbd2e}.g{background:#27c93f}
.ttl{margin-left:8px;font-size:11.5px;color:#5f7d68}
.body{padding:26px 22px;font-size:14px;line-height:1.8;white-space:pre-wrap}
.p{color:var(--green-br)}.c{color:#e8fbee}.o{color:var(--fg-dim)}.y2{color:#fbbf24}
h1{font-size:clamp(2rem,7vw,3rem);margin:0 0 4px;letter-spacing:-.02em}
a{color:var(--green-br)}
.btn{display:inline-block;margin-top:18px;padding:11px 18px;border-radius:8px;background:linear-gradient(180deg,var(--green),#16a34a);color:#04150b;font-weight:700;text-decoration:none;border:1px solid #15803d}
.cursor{display:inline-block;width:.6ch;background:var(--green-br);color:transparent;animation:b 1.05s steps(1) infinite;vertical-align:baseline}
@keyframes b{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="term">
  <div class="bar"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span><span class="ttl">404 — page not found</span></div>
  <div class="body"><span class="p">PS C:\&gt;</span> <span class="c">Get-Page -Path $env:REQUEST_URI</span>
<span class="y2">Get-Page : The path requested was not found.</span>
<span class="o">At line:1 char:1</span>
<span class="o">+ CategoryInfo : ObjectNotFound: (404) [Get-Page]</span>

<h1>404<span class="cursor">_</span></h1>
<span class="o">This page does not exist on this site.</span>
<span class="o">But the toolkit does — head back and grab it.</span>

<a class="btn" href="/ULTIMATE-WINDOWS-OPTIMIZER/">cd .. &nbsp;/&nbsp; Back to home</a></div>
</main>
</body>
</html>
