<text x="336.0" y="19" text-anchor="middle" font-size="11" fill="#8a8a8a">00_Ultimate_Master.bat  (Run as administrator)</text>
<text x="20" y="65" fill="#56c8d8" xml:space="preserve">=========================================================</text>
<text x="20" y="87" fill="#56c8d8" font-weight="bold" xml:space="preserve">  ULTIMATE WINDOWS OPTIMIZER v6.2.0</text>
<text x="20" y="109" fill="#56c8d8" xml:space="preserve">  github.com/DrSamOnline</text>
<text x="20" y="131" fill="#56c8d8" xml:space="preserve">=========================================================</text>
<text x="20" y="175" fill="#cccccc" xml:space="preserve">  OPTIMIZATION PROFILES (each applies a genuinely different,</text>
<text x="20" y="197" fill="#cccccc" xml:space="preserve">  documented set of tweaks - see README.md for details)</text>
<text x="20" y="241" fill="#16c60c" xml:space="preserve">  [1] Daily Home       - balanced, everyday use</text>
<text x="20" y="263" fill="#16c60c" xml:space="preserve">  [2] Gaming           - GPU scheduling, priority boost (desktop)</text>
<text x="20" y="285" fill="#16c60c" xml:space="preserve">  [3] Office           - productivity, background-app trimming</text>
<text x="20" y="307" fill="#16c60c" xml:space="preserve">  [4] Laptop           - battery-aware (safe for laptops)</text>
<text x="20" y="329" fill="#f9f1a5" xml:space="preserve">  [5] Extreme          - aggressive, hardware-gated (desktop)</text>
<text x="20" y="351" fill="#f9f1a5" xml:space="preserve">  [6] Godlike          - maximum aggression, requires confirmation</text>
<text x="20" y="373" fill="#16c60c" xml:space="preserve">  [7] Server           - headless/background-service machines</text>
<text x="20" y="395" fill="#16c60c" xml:space="preserve">  [8] Streaming        - gaming + capture/streaming software</text>
<text x="20" y="439" fill="#56c8d8" xml:space="preserve">  UTILITIES</text>
<text x="20" y="461" fill="#cccccc" xml:space="preserve">  [9]  Compatibility Check       [C] Cleanup System (real space freed)</text>
<text x="20" y="483" fill="#cccccc" xml:space="preserve">  [H]  Hardware Detection        [V] Verify a Profile Was Applied</text>
<text x="20" y="505" fill="#cccccc" xml:space="preserve">  [M]  Performance Snapshot      [R] Compare Two Snapshots</text>
<text x="20" y="527" fill="#cccccc" xml:space="preserve">  [A]  Advanced Modules (8 real toggles)</text>
<text x="20" y="549" fill="#cccccc" xml:space="preserve">  [S]  Create System Restore Point / Open System Restore</text>
<text x="20" y="571" fill="#f9f1a5" xml:space="preserve">  [U]  UNDO ALL TRACKED CHANGES</text>
<text x="20" y="593" fill="#cccccc" xml:space="preserve">  [P]  Prune Old Backup Files (keeps last 20 / 30 days)</text>
<text x="20" y="615" fill="#cccccc" xml:space="preserve">  [D]  Download Optional Diagnostic Tools (HWiNFO64, GPU-Z)</text>
<text x="20" y="659" fill="#cccccc" xml:space="preserve">  [Q] Quit</text>
<text x="20" y="703" fill="#cccccc" xml:space="preserve">Select an option: </text>
</svg>